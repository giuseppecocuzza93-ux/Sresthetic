<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173330">
<title>Sresthetic — Agenda</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f7;color:#173330;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:#f5f7f7ee;backdrop-filter:blur(14px);padding:16px;border-bottom:1px solid #d7e2e0;z-index:5}
.bar{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:900}.sub{font-size:12px;color:#78908c}
main{max-width:1050px;margin:auto;padding:20px 16px 100px}.hero{background:#173330;color:#fff;border-radius:24px;padding:22px}.hero h1{font-size:clamp(28px,7vw,48px);line-height:1;margin:8px 0}.hero p{color:#c5d8d4;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.card{background:#fff;border:1px solid #d7e2e0;border-radius:18px;padding:16px}.metric{font-size:28px;font-weight:900}.muted{color:#67817c;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7e2e0;padding:8px;display:flex;justify-content:center;gap:4px;z-index:10}nav button{border:0;background:none;padding:8px 12px;border-radius:12px;font-weight:800;color:#67817c}nav button.active{background:#e5f3ef;color:#0f766e}
button{cursor:pointer}.primary{border:0;background:#0f766e;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.secondary{border:1px solid #cbd9d6;background:#fff;color:#31534e;border-radius:12px;padding:10px 14px;font-weight:800}.danger{border:0;background:none;color:#b42318}
.section{margin-top:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.list{display:grid;gap:9px}.row{background:#fff;border:1px solid #dfe8e6;border-radius:15px;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
input,select{width:100%;padding:11px;border:1px solid #cbd9d6;border-radius:10px;font:inherit}.empty{text-align:center;padding:24px;color:#78908c}.modal{position:fixed;inset:0;background:#17333066;display:none;align-items:flex-end;justify-content:center;z-index:30;padding:12px}.modal.open{display:flex}.sheet{background:#fff;width:min(620px,100%);border-radius:24px;padding:20px}.formgrid{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#526f6a}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.modal-title{font-size:22px;font-weight:900;margin:0 0 14px}
.calendar-wrap{background:#fff;border:1px solid #d7e2e0;border-radius:20px;overflow:hidden}.calendar-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #d7e2e0}.month-title{font-size:22px;font-weight:900;text-transform:capitalize}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;padding:9px 2px;font-size:11px;font-weight:900;color:#78908c;border-bottom:1px solid #e4ecea}.day{min-height:78px;border-right:1px solid #e8eeed;border-bottom:1px solid #e8eeed;padding:7px;cursor:pointer;position:relative;background:#fff}.day:nth-child(7n){border-right:0}.day.other{background:#f7f9f9;color:#aab9b6}.day.selected{background:#e7f4f1}.day.today .num{background:#0f766e;color:white}.num{display:inline-flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:900}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.dot{width:7px;height:7px;border-radius:50%;background:#0f766e}.dot.personal{background:#7c5cff}.count{font-size:10px;color:#67817c;margin-top:5px}.selected-info{margin-top:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.day{min-height:105px}.calendar-head{padding:18px 20px}}
@media(max-width:520px){.bar .sub{display:none}.day{min-height:62px;padding:5px}.num{width:23px;height:23px;font-size:12px}.count{font-size:9px}.calendar-head{padding:11px}.month-title{font-size:19px}}
</style>
</head>
<body>
<header><div class="bar"><div><div class="brand">SRESTHETIC</div><div class="sub">Agenda personale + professionale</div></div><button class="primary" onclick="addAppointment()">＋ Aggiungi</button></div></header>
<main id="app"><div class="hero"><h1>Sresthetic</h1><p>Caricamento agenda…</p></div></main>
<nav id="nav"></nav><div id="appointmentModal" class="modal" onclick="if(event.target===this)closeAppointment()"><div class="sheet"><h2 class="modal-title" id="modalTitle">Nuovo elemento</h2><form class="formgrid" onsubmit="saveAppointment(event)"><div class="field"><label>Tipo</label><select id="apType" onchange="toggleAppointmentType()"><option value="appointment">💅 Appuntamento</option><option value="event">📌 Impegno</option></select></div><div id="appointmentFields"><div class="field"><label>Cliente</label><input id="apClient" required placeholder="Nome e cognome"></div><div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Data</label><input id="apDate" type="date" required></div><div class="field"><label>Ora</label><input id="apTime" type="time" required></div></div><div class="field"><label>Servizio da eseguire</label><input id="apService" required placeholder="Es. Ricostruzione gel"></div><div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Quanto deve pagare (€)</label><input id="apPrice" type="number" min="0" step="0.01" required placeholder="0,00"></div><div class="field"><label>Stato</label><select id="apStatus"><option value="scheduled">Prenotato</option><option value="confirmed">Confermato</option><option value="completed">Completato / pagato</option><option value="cancelled">Annullato</option></select></div></div><div class="field"><label>Note</label><input id="apNotes" placeholder="Note facoltative"></div></div><div class="actions"><button type="button" class="secondary" onclick="closeAppointment()">Annulla</button><button type="submit" class="primary">Salva appuntamento</button></div></form></div></div>
<script>
(function(){
"use strict";
var KEY="sresthetic-data-v4";
var data;try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){data=null}
if(!data)data={clients:[],appointments:[],tasks:[],events:[],expenses:[],services:[]};if(!Array.isArray(data.services))data.services=[];
var page="home",today=new Date().toISOString().slice(0,10),now=new Date(),calYear=now.getFullYear(),calMonth=now.getMonth(),selectedDate=today;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function nav(){var items=[["home","⌂","Oggi"],["agenda","▣","Agenda"],["clients","♙","Clienti"],["expenses","€","Spese"]];document.getElementById("nav").innerHTML=items.map(function(x){return '<button class="'+(page===x[0]?"active":"")+'" onclick="window.sgo(\''+x[0]+'\')">'+x[1]+" "+x[2]+"</button>"}).join("")}
function render(){nav();var el=document.getElementById("app");if(page==="agenda")return agenda(el);if(page==="clients")return clients(el);if(page==="expenses")return expenses(el);home(el)}
function home(el){var n=data.appointments.filter(function(a){return a.date===today}).length;el.innerHTML='<div class="hero"><div class="muted" style="color:#68c8b9">OGGI</div><h1>Tutto quello che devi ricordare, in un solo posto.</h1><p>Appuntamenti, clienti, impegni personali e spese. I dati restano sul dispositivo.</p></div><div class="grid"><div class="card"><div class="muted">Appuntamenti oggi</div><div class="metric">'+n+'</div></div><div class="card"><div class="muted">Clienti</div><div class="metric">'+data.clients.length+'</div></div><div class="card"><div class="muted">Spese</div><div class="metric">€ '+data.expenses.reduce(function(s,x){return s+Number(x.amount||0)},0).toFixed(2)+'</div></div><div class="card"><div class="muted">Stato</div><div class="metric">✓</div></div></div><div class="section"><div class="head"><h2>Prossimi appuntamenti</h2><button class="primary" onclick="addAppointment()">＋</button></div><div class="list">'+(data.appointments.filter(function(a){return a.date>=today}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}).slice(0,5).map(row).join("")||'<div class="card empty">Nessun appuntamento.</div>')+'</div></div>'}
function row(a){return '<div class="row"><div><b>'+esc(a.date)+' · '+esc(a.time)+'</b><div class="muted">'+esc(a.client||"Impegno")+' · '+esc(a.service||"")+'</div></div><button class="danger" onclick="delApp(\''+a.id+'\')">Elimina</button></div>'}
function agenda(el){
var d=new Date(calYear,calMonth,1),first=(d.getDay()+6)%7,last=new Date(calYear,calMonth+1,0).getDate();
var prev=new Date(calYear,calMonth,0).getDate(),cells=[];
for(var i=0;i<first;i++)cells.push({day:prev-first+i+1,other:true,date:new Date(calYear,calMonth-1,prev-first+i+1)});
for(var day=1;day<=last;day++)cells.push({day:day,other:false,date:new Date(calYear,calMonth,day)});
var next=1;while(cells.length<42)cells.push({day:next++,other:true,date:new Date(calYear,calMonth+1,next-1)});
var months=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
var selected=data.appointments.filter(function(a){return a.date===selectedDate});
el.innerHTML='<div class="head"><div><div class="muted">AGENDA</div><h2 style="margin:4px 0">Calendario</h2></div><button class="primary" onclick="addAppointment()">＋ Appuntamento</button></div>'+
'<div class="calendar-wrap"><div class="calendar-head"><button class="secondary" onclick="changeMonth(-1)">‹</button><div class="month-title">'+months[calMonth]+' '+calYear+'</div><button class="secondary" onclick="changeMonth(1)">›</button></div>'+
'<div class="weekdays"><div>LUN</div><div>MAR</div><div>MER</div><div>GIO</div><div>VEN</div><div>SAB</div><div>DOM</div></div>'+
'<div class="month-grid">'+cells.map(function(c){var ds=c.date.toISOString().slice(0,10),items=data.appointments.filter(function(a){return a.date===ds}),pers=data.events.filter(function(a){return a.date===ds}),isToday=ds===today,isSel=ds===selectedDate;return '<div class="day '+(c.other?"other ":"")+(isToday?"today ":"")+(isSel?"selected":"")+'" onclick="selectDate(\''+ds+'\')"><span class="num">'+c.day+'</span><div class="dots">'+items.slice(0,5).map(function(){return '<span class="dot"></span>'}).join("")+pers.slice(0,3).map(function(){return '<span class="dot personal"></span>'}).join("")+'</div>'+(items.length+pers.length?'<div class="count">'+(items.length+pers.length)+' impegni</div>':"")+'</div>'}).join("")+'</div></div>'+
'<div class="selected-info"><div class="head"><div><h3 style="margin:0">Impegni del '+new Date(selectedDate+"T12:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+'</h3></div><button class="primary" onclick="addAppointment()">＋</button></div><div class="list">'+
(selected.length?selected.sort(function(a,b){return a.time.localeCompare(b.time)}).map(row).join(""):'<div class="card empty">Nessun appuntamento in questa giornata.</div>')+
data.events.filter(function(e){return e.date===selectedDate}).map(function(e){return '<div class="row"><div><b>🟣 '+esc(e.title)+'</b><div class="muted">'+esc(e.time||"")+' · personale</div></div></div>'}).join("")+
'</div></div>'
}
function clients(el){el.innerHTML='<div class="head"><div><h2>Clienti</h2><div class="muted">'+data.clients.length+' clienti</div></div><button class="primary" onclick="addClient()">＋ Cliente</button></div><div class="list">'+(data.clients.map(function(c){return '<div class="row"><div><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.phone||"")+'</div></div></div>'}).join("")||'<div class="card empty">Nessuna cliente.</div>')+'</div>'}
function expenses(el){el.innerHTML='<div class="head"><div><h2>Spese</h2><div class="muted">Totale registrato</div></div><button class="primary" onclick="addExpense()">＋ Spesa</button></div><div class="list">'+(data.expenses.map(function(x){return '<div class="row"><div><b>'+esc(x.description)+'</b><div class="muted">'+esc(x.date)+'</div></div><b>€ '+Number(x.amount||0).toFixed(2)+'</b></div>'}).join("")||'<div class="card empty">Nessuna spesa.</div>')+'</div>'}
window.sgo=function(p){page=p;render()};window.changeMonth=function(n){calMonth+=n;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}render()};window.selectDate=function(ds){selectedDate=ds;page="agenda";render()};
window.addAppointment=function(){document.getElementById("apType").value="appointment";document.getElementById("apClient").value="";document.getElementById("apDate").value=selectedDate||today;document.getElementById("apTime").value="09:00";document.getElementById("apService").value="";document.getElementById("apPrice").value="";document.getElementById("apStatus").value="scheduled";document.getElementById("apNotes").value="";toggleAppointmentType();document.getElementById("appointmentModal").classList.add("open")};window.toggleAppointmentType=function(){var type=document.getElementById("apType").value,isApp=type==="appointment";document.getElementById("modalTitle").textContent=isApp?"Nuovo appuntamento":"Nuovo impegno";document.getElementById("appointmentFields").style.display=isApp?"grid":"none";document.getElementById("apClient").required=isApp;document.getElementById("apService").required=isApp;document.getElementById("apPrice").required=false};window.closeAppointment=function(){document.getElementById("appointmentModal").classList.remove("open")};window.saveAppointment=function(e){e.preventDefault();var type=document.getElementById("apType").value;if(type==="event"){var ev={id:String(Date.now()),title:document.getElementById("apNotes").value.trim()||"Impegno",date:document.getElementById("apDate").value,time:document.getElementById("apTime").value};data.events=data.events||[];data.events.push(ev);save();selectedDate=ev.date;calYear=Number(ev.date.slice(0,4));calMonth=Number(ev.date.slice(5,7))-1;closeAppointment();render();return}var a={id:String(Date.now()),client:document.getElementById("apClient").value.trim(),date:document.getElementById("apDate").value,time:document.getElementById("apTime").value,service:document.getElementById("apService").value.trim(),price:Number(document.getElementById("apPrice").value)||0,status:document.getElementById("apStatus").value,notes:document.getElementById("apNotes").value.trim()};data.appointments.push(a);var existing=data.services.find(function(s){return s.name.toLowerCase()===a.service.toLowerCase()});if(!existing)data.services.push({id:String(Date.now())+"s",name:a.service,price:a.price});save();selectedDate=a.date;calYear=Number(a.date.slice(0,4));calMonth=Number(a.date.slice(5,7))-1;closeAppointment();render()};
window.addClient=function(){var name=prompt("Nome e cognome");if(!name)return;var phone=prompt("Telefono","");data.clients.push({id:String(Date.now()),name:name,phone:phone||""});save();render()};
window.addExpense=function(){var d=prompt("Descrizione");if(!d)return;var a=prompt("Importo (€)","0");data.expenses.push({id:String(Date.now()),description:d,amount:Number(a)||0,date:today});save();render()};
window.delApp=function(i){data.appointments=data.appointments.filter(function(a){return a.id!==i});save();render()};
render();
})();
</script>
</body></html>
