<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173330">
<title>Sresthetic — Agenda</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f7;color:#173330;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:#f5f7f7ee;backdrop-filter:blur(14px);padding:16px;border-bottom:1px solid #d7e2e0;z-index:5}
.bar{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:900}.sub{font-size:12px;color:#78908c}
main{max-width:1050px;margin:auto;padding:20px 16px 100px}.hero{background:#173330;color:#fff;border-radius:24px;padding:22px}.hero h1{font-size:clamp(28px,7vw,48px);line-height:1;margin:8px 0}.hero p{color:#c5d8d4;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.card{background:#fff;border:1px solid #d7e2e0;border-radius:18px;padding:16px}.metric{font-size:28px;font-weight:900}.muted{color:#67817c;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7e2e0;padding:8px;display:flex;justify-content:center;gap:4px;z-index:10}nav button{border:0;background:none;padding:8px 12px;border-radius:12px;font-weight:800;color:#67817c}nav button.active{background:#e5f3ef;color:#0f766e}
button{cursor:pointer}.primary{border:0;background:#0f766e;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.secondary{border:1px solid #cbd9d6;background:#fff;color:#31534e;border-radius:12px;padding:10px 14px;font-weight:800}.danger{border:0;background:none;color:#b42318}
.section{margin-top:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.list{display:grid;gap:9px}.row{background:#fff;border:1px solid #dfe8e6;border-radius:15px;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
input,select{width:100%;padding:11px;border:1px solid #cbd9d6;border-radius:10px;font:inherit}.empty{text-align:center;padding:24px;color:#78908c}.modal{position:fixed;inset:0;background:#17333066;display:none;align-items:flex-end;justify-content:center;z-index:30;padding:12px}.modal.open{display:flex}.sheet{background:#fff;width:min(620px,100%);border-radius:24px;padding:20px}.formgrid{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#526f6a}.client-picker{position:relative}.client-picker input{padding-right:48px}.client-toggle{position:absolute;right:4px;top:4px;height:34px;padding:6px 10px}.client-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #cbd9d6;border-radius:12px;box-shadow:0 10px 25px #17333022;z-index:50;max-height:220px;overflow:auto}.client-menu.open{display:block}.client-option{padding:12px;border-bottom:1px solid #edf2f1;cursor:pointer}.client-option:last-child{border-bottom:0}.client-option b{display:block}.client-option span{font-size:12px;color:#78908c}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.modal-title{font-size:22px;font-weight:900;margin:0 0 14px}
.calendar-wrap{background:#fff;border:1px solid #d7e2e0;border-radius:20px;overflow:hidden}.calendar-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #d7e2e0}.month-title{font-size:22px;font-weight:900;text-transform:capitalize}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;padding:9px 2px;font-size:11px;font-weight:900;color:#78908c;border-bottom:1px solid #e4ecea}.day{min-height:78px;border-right:1px solid #e8eeed;border-bottom:1px solid #e8eeed;padding:7px;cursor:pointer;position:relative;background:#fff}.day:nth-child(7n){border-right:0}.day.other{background:#f7f9f9;color:#aab9b6}.day.selected{background:#e7f4f1}.day.today .num{background:#0f766e;color:white}.num{display:inline-flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:900}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.dot{width:7px;height:7px;border-radius:50%;background:#0f766e}.dot.personal{background:#7c5cff}.count{font-size:10px;color:#67817c;margin-top:5px}.selected-info{margin-top:14px}.wa-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.day{min-height:105px}.calendar-head{padding:18px 20px}}
@media(max-width:520px){.bar .sub{display:none}.day{min-height:62px;padding:5px}.num{width:23px;height:23px;font-size:12px}.count{font-size:9px}.calendar-head{padding:11px}.month-title{font-size:19px}}
</style>
</head>
<body>
<header><div class="bar"><div><div class="brand">SRESTHETIC</div><div class="sub">Agenda personale + professionale</div></div><button class="primary" onclick="addAppointment()">＋ Aggiungi</button></div></header>
<main id="app"><div class="hero"><h1>Sresthetic</h1><p>Caricamento agenda…</p></div></main>
<nav id="nav"></nav><div id="whatsappModal" class="modal" onclick="if(event.target===this)closeWhatsApp()"><div class="sheet"><h2 class="modal-title" id="waTitle">Messaggio WhatsApp</h2><div class="muted" id="waRecipient"></div><div class="field" style="margin-top:12px"><label>Messaggio</label><textarea id="waMessage" rows="7" style="width:100%;padding:11px;border:1px solid #cbd9d6;border-radius:10px;font:inherit;resize:vertical"></textarea></div><div class="wa-actions"><button type="button" class="secondary" onclick="closeWhatsApp()">Chiudi</button><button type="button" class="primary" id="waSendBtn">Invia su WhatsApp</button></div></div></div><div id="appointmentModal" class="modal" onclick="if(event.target===this)closeAppointment()"><div class="sheet"><h2 class="modal-title" id="modalTitle">Nuovo elemento</h2><form class="formgrid" onsubmit="saveAppointment(event)"><div class="field"><label>Tipo</label><select id="apType" onchange="toggleAppointmentType()"><option value="appointment">💅 Appuntamento</option><option value="event">📌 Impegno</option></select></div><div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Data</label><input id="apDate" type="date" required></div><div class="field"><label>Ora</label><input id="apTime" type="time" required></div></div><div id="appointmentFields" class="formgrid"><div class="field"><label>Cliente</label><div class="client-picker"><input id="apClient" placeholder="Nome e cognome" autocomplete="off" oninput="filterClients()" onfocus="showClients()"><button type="button" class="secondary client-toggle" onclick="toggleClients()">⌄</button><div id="clientMenu" class="client-menu"></div></div></div><div class="field"><label>Servizio da eseguire</label><input id="apService" placeholder="Es. Ricostruzione gel"></div><div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Quanto deve pagare (€)</label><input id="apPrice" type="number" min="0" step="0.01" placeholder="0,00"></div><div class="field"><label>Stato</label><select id="apStatus"><option value="scheduled">Prenotato</option><option value="confirmed">Confermato</option><option value="completed">Pagato / completato</option><option value="cancelled">Annullato</option></select></div></div></div><div id="eventDescription" class="field" style="display:none"><label>Cosa devi fare?</label><input id="apEventTitle" placeholder="Es. Andare dal commercialista"></div><div class="field"><label>Note</label><input id="apNotes" placeholder="Note facoltative"></div><div class="actions"><button type="button" class="secondary" onclick="closeAppointment()">Annulla</button><button type="submit" class="primary">Salva</button></div></form></div></div>
<script>
(function(){
"use strict";
var KEY="sresthetic-data-v4";
var data;try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){data=null}
if(!data)data={clients:[],appointments:[],tasks:[],events:[],expenses:[],services:[]};if(!Array.isArray(data.services))data.services=[];if(!data.settings)data.settings={};if(!data.settings.confirmationMessage)data.settings.confirmationMessage="Ciao {nome}, ti confermo il tuo appuntamento per il {data} alle {ora} per {trattamento}. A presto!";if(!data.settings.reminderMessage)data.settings.reminderMessage="Ciao {nome}, ti ricordo il tuo appuntamento di domani {data} alle {ora} per {trattamento}. A presto!";
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}var page="home",today=dateKey(new Date()),now=new Date(),calYear=now.getFullYear(),calMonth=now.getMonth(),selectedDate=today;
function fmtDate(s){if(!s)return "";var p=String(s).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s}function toIsoDate(s){var p=String(s||"").split("/");return p.length===3?p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0"):s}function save(){try{var raw=JSON.stringify(data);localStorage.setItem(KEY,raw);var b=[];try{b=JSON.parse(localStorage.getItem("sresthetic-auto-backups")||"[]")}catch(e){}b.unshift({date:new Date().toISOString(),data:data});localStorage.setItem("sresthetic-auto-backups",JSON.stringify(b.slice(0,10)))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function nav(){var items=[["home","⌂","Oggi"],["agenda","▣","Agenda"],["clients","♙","Clienti"],["finance","€","Finanze"],["settings","⚙","Impostazioni"]];document.getElementById("nav").innerHTML=items.map(function(x){return '<button class="'+(page===x[0]?"active":"")+'" onclick="window.sgo(\''+x[0]+'\')">'+x[1]+" "+x[2]+"</button>"}).join("")}
function render(){nav();var el=document.getElementById("app");if(page==="agenda")return agenda(el);if(page==="clients")return clients(el);if(page==="finance")return finance(el);if(page==="settings")return settings(el);home(el)}
function periodDates(period){var d=new Date(),y=d.getFullYear(),m=d.getMonth(),start,end;if(period==="today"){start=new Date(y,m,d.getDate());end=new Date(y,m,d.getDate())}else if(period==="week"){var day=(d.getDay()+6)%7;start=new Date(y,m,d.getDate()-day);end=new Date(y,m,d.getDate()-day+6)}else if(period==="year"){start=new Date(y,0,1);end=new Date(y,11,31)}else if(period==="all"){start=new Date(2000,0,1);end=new Date(2999,11,31)}else{start=new Date(y,m,1);end=new Date(y,m+1,0)}return {start:dateKey(start),end:dateKey(end)}}
function inPeriod(date,period){var p=periodDates(period);return date>=p.start&&date<=p.end}
function eventItem(e,label){return '<div class="row"><div><b>'+esc(e.time||"")+" · "+esc(e.title||e.client||"Impegno")+'</b><div class="muted">'+esc(label||"")+(e.service?" · "+esc(e.service):"")+'</div></div></div>'}
function home(el){var d=new Date();var tomorrowDate=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1),tomorrow=dateKey(tomorrowDate);var todayApps=data.appointments.filter(function(a){return a.date===today&&a.status!=="cancelled"}).sort(function(a,b){return a.time.localeCompare(b.time)});var todayEvents=(data.events||[]).filter(function(e){return e.date===today}).sort(function(a,b){return (a.time||"").localeCompare(b.time||"")});var tomApps=data.appointments.filter(function(a){return a.date===tomorrow&&a.status!=="cancelled"}).sort(function(a,b){return a.time.localeCompare(b.time)});var tomEvents=(data.events||[]).filter(function(e){return e.date===tomorrow}).sort(function(a,b){return (a.time||"").localeCompare(b.time||"")});var todayHtml=todayApps.map(function(a){return `<div class="row"><div><b>${esc(a.time)} · ${esc(a.client)}</b><div class="muted">💅 ${esc(a.service)} · € ${Number(a.price||0).toFixed(2)}</div></div><button class="secondary" onclick="editApp('${a.id}')">Apri</button></div>`}).join("")+todayEvents.map(function(e){return `<div class="row"><div><b>🟣 ${esc(e.time||"")} · ${esc(e.title)}</b><div class="muted">Impegno personale</div></div><div style="display:flex;gap:6px"><button class="secondary" onclick="editEvent('${e.id}')">Apri</button><button class="danger" onclick="delEvent('${e.id}')">Elimina</button></div></div>`}).join("");var tomorrowHtml=tomApps.map(function(a){return `<div class="row"><div><b>${esc(a.time)} · ${esc(a.client)}</b><div class="muted">💅 ${esc(a.service)} · € ${Number(a.price||0).toFixed(2)}</div></div><button class="secondary" onclick="sendWhatsApp('${a.id}','reminder')">WhatsApp</button><button class="secondary" onclick="editApp('${a.id}')">Apri</button></div>`}).join("")+tomEvents.map(function(e){return `<div class="row"><div><b>🟣 ${esc(e.time||"")} · ${esc(e.title)}</b><div class="muted">Impegno personale</div></div><button class="secondary" onclick="editEvent('${e.id}')">Apri</button></div>`}).join("");el.innerHTML=`<div class="hero"><div class="muted" style="color:#68c8b9">OGGI · ${fmtDate(today)}</div><h1>Il tuo focus è sulla giornata.</h1><p>Qui trovi subito gli appuntamenti e gli impegni di oggi, oltre a quello che ti aspetta domani.</p></div><div class="grid"><div class="card"><div class="muted">Impegni oggi</div><div class="metric">${todayApps.length+todayEvents.length}</div><div class="muted">appuntamenti + personali</div></div><div class="card"><div class="muted">Impegni domani</div><div class="metric">${tomApps.length+tomEvents.length}</div><div class="muted">${fmtDate(tomorrow)}</div></div><div class="card"><div class="muted">Appuntamenti oggi</div><div class="metric">${todayApps.length}</div></div><div class="card"><div class="muted">Clienti</div><div class="metric">${data.clients.length}</div></div></div><div class="section"><div class="head"><div><h2 style="margin:0">Focus di oggi</h2><div class="muted">${fmtDate(today)}</div></div><button class="primary" onclick="addAppointment()">＋ Appuntamento</button></div><div class="list">${todayHtml||'<div class="card empty">Nessun appuntamento o impegno oggi.</div>'}</div></div><div class="section"><div class="head"><div><h2 style="margin:0">Focus di domani</h2><div class="muted">${fmtDate(tomorrow)}</div></div><button class="secondary" onclick="addAppointmentForDate('${tomorrow}')">＋ Aggiungi</button></div><div class="list">${tomorrowHtml||'<div class="card empty">Nessun appuntamento o impegno domani.</div>'}</div></div>`}
function row(a){return '<div class="row"><div><b>'+esc(fmtDate(a.date))+' · '+esc(a.time)+'</b><div class="muted">'+esc(a.client||"Impegno")+' · '+esc(a.service||"")+'</div></div><button class="secondary" onclick="editApp(\''+a.id+'\')">Modifica</button></div>'}
function agenda(el){
var d=new Date(calYear,calMonth,1),first=(d.getDay()+6)%7,last=new Date(calYear,calMonth+1,0).getDate();
var prev=new Date(calYear,calMonth,0).getDate(),cells=[];
for(var i=0;i<first;i++)cells.push({day:prev-first+i+1,other:true,date:new Date(calYear,calMonth-1,prev-first+i+1)});
for(var day=1;day<=last;day++)cells.push({day:day,other:false,date:new Date(calYear,calMonth,day)});
var next=1;while(cells.length<42)cells.push({day:next++,other:true,date:new Date(calYear,calMonth+1,next-1)});
var months=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
var selected=data.appointments.filter(function(a){return a.date===selectedDate});
el.innerHTML='<div class="head"><div><div class="muted">AGENDA</div><h2 style="margin:4px 0">Calendario</h2></div><button class="primary" onclick="addAppointment()">＋ Appuntamento</button></div>'+
'<div class="calendar-wrap"><div class="calendar-head"><button class="secondary" onclick="changeMonth(-1)">‹</button><div class="month-title">'+months[calMonth]+' '+calYear+'</div><button class="secondary" onclick="changeMonth(1)">›</button></div>'+
'<div class="weekdays"><div>LUN</div><div>MAR</div><div>MER</div><div>GIO</div><div>VEN</div><div>SAB</div><div>DOM</div></div>'+
'<div class="month-grid">'+cells.map(function(c){var ds=dateKey(c.date),items=data.appointments.filter(function(a){return a.date===ds}),pers=data.events.filter(function(a){return a.date===ds}),isToday=ds===today,isSel=ds===selectedDate;return '<div class="day '+(c.other?"other ":"")+(isToday?"today ":"")+(isSel?"selected":"")+'" onclick="selectDate(\''+ds+'\')"><span class="num">'+c.day+'</span><div class="dots">'+items.slice(0,5).map(function(){return '<span class="dot"></span>'}).join("")+pers.slice(0,3).map(function(){return '<span class="dot personal"></span>'}).join("")+'</div>'+(items.length+pers.length?'<div class="count">'+(items.length+pers.length)+' impegni</div>':"")+'</div>'}).join("")+'</div></div>'+
'<div class="selected-info"><div class="head"><div><h3 style="margin:0">Impegni del '+new Date(selectedDate+"T12:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+'</h3></div><button class="primary" onclick="addAppointment()">＋</button></div><div class="list">'+
(selected.length?selected.sort(function(a,b){return a.time.localeCompare(b.time)}).map(row).join(""):'<div class="card empty">Nessun appuntamento in questa giornata.</div>')+
data.events.filter(function(e){return e.date===selectedDate}).map(function(e){return '<div class="row"><div><b>🟣 '+esc(e.title)+'</b><div class="muted">'+esc(e.time||"")+' · personale</div></div><div style="display:flex;gap:6px"><button class="secondary" onclick="editEvent(\''+e.id+'\')">Modifica</button><button class="danger" onclick="delEvent(\''+e.id+'\')">Elimina</button></div></div>'}).join("")+
'</div></div>'
}
function clients(el){el.innerHTML='<div class="head"><div><h2>Clienti</h2><div class="muted">'+data.clients.length+' clienti</div></div><button class="primary" onclick="addClient()">＋ Cliente</button></div><div class="list">'+(data.clients.map(function(c){return '<div class="row"><div><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.phone||"")+'</div></div><div style="display:flex;gap:6px"><button class="secondary" onclick="editClient(\''+c.id+'\')">Modifica</button><button class="danger" onclick="delClient(\''+c.id+'\')">Elimina</button></div></div>'}).join("")||'<div class="card empty">Nessuna cliente.</div>')+'</div>'}
function finance(el){var period=window.reportPeriod||"month",p=periodDates(period),apps=data.appointments.filter(function(a){return a.date>=p.start&&a.date<=p.end}),paid=apps.filter(function(a){return a.status==="completed"}),pending=apps.filter(function(a){return a.status!=="cancelled"&&a.status!=="completed"}),incassi=paid.reduce(function(s,a){return s+Number(a.price||0)},0),daIncassare=pending.reduce(function(s,a){return s+Number(a.price||0)},0),spese=data.expenses.filter(function(x){return x.date>=p.start&&x.date<=p.end}),totSpese=spese.reduce(function(s,x){return s+Number(x.amount||0)},0),utile=incassi-totSpese;var services={};paid.forEach(function(a){var k=a.service||"Senza servizio";services[k]=(services[k]||0)+Number(a.price||0)});el.innerHTML='<div class="head"><div><h2>Finanze & Report</h2><div class="muted">Entrate, spese e risultati in un unico posto</div></div><button class="primary" onclick="addExpense()">＋ Spesa</button></div><div class="card"><div class="head"><div><b>Periodo del report</b><div class="muted">'+fmtDate(p.start)+' → '+fmtDate(p.end)+'</div></div><select style="width:auto;min-width:150px" onchange="setReportPeriod(this.value)"><option value="today" '+(period==="today"?"selected":"")+'>Oggi</option><option value="week" '+(period==="week"?"selected":"")+'>Questa settimana</option><option value="month" '+(period==="month"?"selected":"")+'>Questo mese</option><option value="year" '+(period==="year"?"selected":"")+'>Quest\'anno</option><option value="all" '+(period==="all"?"selected":"")+'>Tutto</option></select></div></div><div class="grid"><div class="card"><div class="muted">Incassato</div><div class="metric">€ '+incassi.toFixed(2)+'</div><div class="muted">'+paid.length+' appuntamenti pagati</div></div><div class="card"><div class="muted">Da incassare</div><div class="metric">€ '+daIncassare.toFixed(2)+'</div><div class="muted">'+pending.length+' appuntamenti</div></div><div class="card"><div class="muted">Spese</div><div class="metric">€ '+totSpese.toFixed(2)+'</div><div class="muted">'+spese.length+' movimenti</div></div><div class="card"><div class="muted">Utile</div><div class="metric">€ '+utile.toFixed(2)+'</div><div class="muted">incassato − spese</div></div></div><div class="section"><div class="head"><div><h3 style="margin:0">Incassi per servizio</h3></div></div><div class="list">'+(Object.keys(services).sort().map(function(k){return '<div class="row"><b>'+esc(k)+'</b><b>€ '+services[k].toFixed(2)+'</b></div>'}).join("")||'<div class="card empty">Nessun incasso nel periodo.</div>')+'</div></div><div class="section"><div class="head"><div><h3 style="margin:0">Spese</h3><div class="muted">Modifica o elimina qualsiasi movimento</div></div></div><div class="list">'+(spese.sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(x){return '<div class="row"><div><b>'+esc(x.description)+'</b><div class="muted">'+esc(fmtDate(x.date))+'</div></div><div style="display:flex;align-items:center;gap:6px"><b>€ '+Number(x.amount||0).toFixed(2)+'</b><button class="secondary" onclick="editExpense(\''+x.id+'\')">Modifica</button><button class="danger" onclick="delExpense(\''+x.id+'\')">Elimina</button></div></div>'}).join("")||'<div class="card empty">Nessuna spesa nel periodo.</div>')+'</div></div></div>'}

function settings(el){el.innerHTML='<div class="head"><div><h2>Impostazioni</h2><div class="muted">Personalizza Sresthetic</div></div></div><div class="card"><h3 style="margin-top:0">Messaggi WhatsApp</h3><p class="muted">Variabili disponibili: {nome}, {data}, {ora}, {trattamento}.</p><div class="field"><label>Conferma prenotazione</label><textarea id="confirmationMessage" rows="4" style="width:100%;padding:11px;border:1px solid #cbd9d6;border-radius:10px;font:inherit;resize:vertical">'+esc(data.settings.confirmationMessage)+'</textarea></div><div class="field" style="margin-top:12px"><label>Promemoria del giorno prima</label><textarea id="reminderMessage" rows="4" style="width:100%;padding:11px;border:1px solid #cbd9d6;border-radius:10px;font:inherit;resize:vertical">'+esc(data.settings.reminderMessage)+'</textarea></div><div class="actions"><button class="primary" onclick="saveWhatsAppSettings()">Salva messaggi</button></div></div><div class="card" style="margin-top:12px"><h3 style="margin-top:0">Backup</h3><p class="muted">Esporta o ripristina tutti i dati di Sresthetic.</p><button class="primary" onclick="exportBackup()">⬇️ Esporta backup</button><button class="secondary" style="margin-left:6px" onclick="document.getElementById(\'restoreFile\').click()">⬆️ Ripristina</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(event)"></div><div class="card" style="margin-top:12px"><h3 style="margin-top:0">Backup automatico</h3><div class="row"><div><b>Attivo</b><div class="muted">Viene creata una copia locale ad ogni salvataggio.</div></div><b>✓</b></div></div>'}window.sgo=function(p){page=p;render()};window.reportPeriod="month";window.setReportPeriod=function(p){window.reportPeriod=p;render()};window.addFocus=function(){var title=prompt("Cosa vuoi mettere nel Focus?");if(!title)return;var dt=prompt("Scadenza (GG/MM/AAAA), lascia vuoto per nessuna",fmtDate(today));var iso=dt?toIsoDate(dt):"";data.tasks=data.tasks||[];data.tasks.push({id:String(Date.now()),title:title.trim(),date:iso,done:false});save();render()};window.completeFocus=function(id){var t=(data.tasks||[]).find(function(x){return x.id===id});if(!t)return;t.done=true;save();render()};window.addAppointmentForDate=function(ds){selectedDate=ds;calYear=Number(ds.slice(0,4));calMonth=Number(ds.slice(5,7))-1;addAppointment()};window.changeMonth=function(n){calMonth+=n;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}render()};window.selectDate=function(ds){selectedDate=ds;page="agenda";render()};
window.exportBackup=function(){var p={app:"Sresthetic",version:1,exportedAt:new Date().toISOString(),data:data};var blob=new Blob([JSON.stringify(p,null,2)],{type:"application/json"});var u=URL.createObjectURL(blob);var a=document.createElement("a");a.href=u;a.download="sresthetic-backup-"+today+".json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};window.restoreBackup=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result),d=p.data||p;if(!d||!Array.isArray(d.appointments)||!Array.isArray(d.clients))throw 0;data=d;if(!Array.isArray(data.events))data.events=[];if(!Array.isArray(data.expenses))data.expenses=[];if(!Array.isArray(data.tasks))data.tasks=[];if(!Array.isArray(data.services))data.services=[];save();alert("Backup ripristinato.");render()}catch(x){alert("Backup non valido.")}};r.readAsText(f);e.target.value=""};function fillClientList(){filterClients()}

window.addAppointment=function(){fillClientList();window.editingAppointmentId=null;window.editingEventId=null;document.getElementById("apType").value="appointment";document.getElementById("apClient").value="";document.getElementById("apDate").value=selectedDate||today;document.getElementById("apTime").value="09:00";document.getElementById("apService").value="";document.getElementById("apPrice").value="";document.getElementById("apStatus").value="scheduled";document.getElementById("apNotes").value="";document.getElementById("apEventTitle").value="";toggleAppointmentType();document.getElementById("appointmentModal").classList.add("open")};window.clientNameBlur=function(){var input=document.getElementById("apClient");if(!input)return;var name=input.value.trim();if(!name)return;var existing=data.clients.find(function(c){var n=String(c.name||"").trim().toLowerCase(),q=name.toLowerCase();return n===q||n.indexOf(q)>=0||q.indexOf(n)>=0});if(existing){if(!document.getElementById("apClient").value.trim())document.getElementById("apClient").value=existing.name;return}if(window.editingAppointmentId)return;var phone=prompt("Cliente non ancora salvata. Vuoi aggiungere il numero di telefono?\nLascia vuoto se non vuoi salvarlo.", "");if(phone===null)return;data.clients.push({id:String(Date.now()),name:name,phone:phone.trim()});save();};

window.editExpense=function(id){var x=data.expenses.find(function(v){return v.id===id});if(!x)return;var d=prompt("Descrizione",x.description||"");if(d===null)return;var a=prompt("Importo (€)",String(x.amount||0));if(a===null)return;var dt=prompt("Data (GG/MM/AAAA)",fmtDate(x.date));if(dt===null)return;x.description=d;x.amount=Number(a)||0;x.date=toIsoDate(dt)||x.date;save();render()};window.delExpense=function(id){if(!confirm("Eliminare questa spesa?"))return;data.expenses=data.expenses.filter(function(x){return x.id!==id});save();render()};window.editClient=function(id){var x=data.clients.find(function(v){return v.id===id});if(!x)return;var n=prompt("Nome e cognome",x.name||"");if(n===null)return;var p=prompt("Telefono",x.phone||"");if(p===null)return;x.name=n;x.phone=p;save();render()};window.delClient=function(id){if(!confirm("Eliminare questa cliente?"))return;data.clients=data.clients.filter(function(x){return x.id!==id});save();render()};window.addClient=function(){var name=prompt("Nome e cognome");if(!name)return;var phone=prompt("Telefono","");data.clients.push({id:String(Date.now()),name:name,phone:phone||""});save();render()};window.editClient=function(id){var x=data.clients.find(function(v){return v.id===id});if(!x)return;var n=prompt("Nome e cognome",x.name||"");if(n===null)return;var p=prompt("Telefono",x.phone||"");if(p===null)return;x.name=n;x.phone=p;save();render()};window.delClient=function(id){if(!confirm("Eliminare questa cliente?"))return;data.clients=data.clients.filter(function(x){return x.id!==id});save();render()};window.addExpense=function(){var d=prompt("Descrizione");if(!d)return;var a=prompt("Importo (€)","0");if(a===null)return;var dt=prompt("Data (GG/MM/AAAA)",fmtDate(today));if(dt===null)return;data.expenses.push({id:String(Date.now()),description:d,amount:Number(a)||0,date:toIsoDate(dt)||today});save();render()};window.editExpense=function(id){var x=data.expenses.find(function(v){return v.id===id});if(!x)return;var d=prompt("Descrizione",x.description||"");if(d===null)return;var a=prompt("Importo (€)",String(x.amount||0));if(a===null)return;var dt=prompt("Data (GG/MM/AAAA)",fmtDate(x.date));if(dt===null)return;x.description=d;x.amount=Number(a)||0;x.date=toIsoDate(dt)||x.date;save();render()};window.delExpense=function(id){if(!confirm("Eliminare questa spesa?"))return;data.expenses=data.expenses.filter(function(x){return x.id!==id});save();render()};
window.delEvent=function(id){if(!confirm("Eliminare questo impegno?"))return;data.events=data.events.filter(function(x){return x.id!==id});save();render()};window.editEvent=function(id){var ev=(data.events||[]).find(function(x){return x.id===id});if(!ev)return;document.getElementById("apType").value="event";document.getElementById("apDate").value=ev.date;document.getElementById("apTime").value=ev.time||"09:00";document.getElementById("apEventTitle").value=ev.title||"";document.getElementById("apNotes").value=ev.notes||"";toggleAppointmentType();document.getElementById("modalTitle").textContent="Modifica impegno";window.editingEventId=id;document.getElementById("appointmentModal").classList.add("open")};
function waNumber(phone){var n=String(phone||"").replace(/\D/g,"");if(n.indexOf("00")===0)n=n.slice(2);if(n.length===10&&n.indexOf("3")===0)n="39"+n;return n}
function findClientByName(name){var q=String(name||"").trim().toLowerCase();return data.clients.find(function(c){return String(c.name||"").trim().toLowerCase()===q})||data.clients.find(function(c){return String(c.name||"").trim().toLowerCase().indexOf(q)>=0||q.indexOf(String(c.name||"").trim().toLowerCase())>=0})}
